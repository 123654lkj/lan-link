[package]
name = "lan-link-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lan-link-gui"
path = "src/main.rs"

[dependencies]
lan-link-protocol = { path = "../protocol" }
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
rand = "0.8"
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
