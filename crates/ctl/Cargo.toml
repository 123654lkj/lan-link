[package]
name = "lan-linkctl"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "lan-linkctl"
path = "src/main.rs"

[dependencies]
lan-link-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
hex = "0.4"
rand = "0.8"
bincode = "1"
