[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/shell",
    "crates/video",
    "crates/daemon",
    "crates/ctl",
    "crates/gui",
]

[workspace.package]
authors = ["xiantuer"]
edition = "2021"
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/xiantuer/lan-link"
description = "A LAN remote management tool with encrypted UDP channels"

[workspace.dependencies]
anyhow = "1"
bincode = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
